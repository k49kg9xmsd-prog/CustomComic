name: RobotPlanner
options:
  bundleIdPrefix: com.robotplanner
  deploymentTarget:
    iOS: "16.0"

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.20

targets:
  RobotPlanner:
    type: application
    platform: iOS
    sources:
      - path: RobotPlanner
    dependencies:
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.robotplanner.app
        PRODUCT_NAME: RobotPlanner
        INFOPLIST_FILE: RobotPlanner/Info.plist
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
